# Phase-1 collection with Qwen3.5-9B as the agent backbone.
#
#   python datagen/collect/run_batch.py --config collect-qwen --dry-run
#   python datagen/collect/run_batch.py --config collect-qwen
#
# Self-contained: tune this file without affecting the deepseek run. Endpoints
# are the one thing NOT set here — they come from serve.yaml.
#
# This backbone is served with a tool-call parser, so it drives BOTH harnesses
# (verified: Captain-Agent's `seek_experts_help` delegation builds a real
# expert team).

backbone: qwen3.5-9b

# ── Harnesses ─────────────────────────────────────────────────────────────────
# Each runs in its own venv: Magentic-One needs autogen 0.7, Captain-Agent
# imports a vendored autogen 0.2 fork, and neither can share attribscope's.
harnesses:
  magentic:
    root:   datagen/TraceElephant/code/agent_system/Magentic-One
    python: .venv/bin/python
    driver: run_pool.py
    # MultimodalWebSurfer is deliberately absent: it sends screenshots (needs a
    # vision backbone) and drives headful Chromium.
    agents: fs,coder,executor

  captain:
    root:   datagen/TraceElephant/code/agent_system/Captain-Agent
    python: .venv/bin/python
    driver: scripts/run_pool.py
    # The vendored autogen is imported from the harness repo root.
    pythonpath: "."

# ── What to run ───────────────────────────────────────────────────────────────
# `limit` caps tasks taken from the head of a pool; `reps` re-runs each task
# (sampling variation).
#
# Weighting note: trajectory richness tracks task difficulty. Measured step
# counts — gsm8k 4 (orchestrator answers alone, no delegation), math500 6,
# gaia 36 (magentic) / 14 (captain, real expert team). Easy
# parametric-knowledge questions yield ~one scoreable step and no inter-agent
# structure, so they are deliberately down-weighted.
matrix:
  # NOTE: only the web-native pools are active. The others are commented out
  # rather than deleted so the full matrix can be restored in one edit.
  #   - gsm8k / math500 / arc / mmlu-pro are self-contained (76-84% solved with
  #     NO web access) and need no Serper budget, but yield shallow trajectories
  #     (arc max 6 steps, median 4-5) with little attribution signal.
  #   - hotpotqa / 2wikimqa / musique score 9-31% only because pools/prepare.py
  #     drops their supporting-context paragraphs, turning reading comprehension
  #     into closed-book trivia. Re-enable them once context is added, not before.
  # Rich, tool-forcing tasks: the highest-value trajectories.
  - harnesses: [magentic, captain]
    pools:     [gaia, assistantbench]
    limit:     null
    reps:      1
  # Multi-step reasoning; moderate delegation.
  # - harnesses: [magentic, captain]
  #   pools:     [math500, mmlu-pro]
  #   limit:     300
  #   reps:      1
  # Cheap breadth; mostly shallow trajectories, kept for distribution coverage.
  # - harnesses: [magentic, captain]
  #   pools:     [hotpotqa, 2wikimqa, musique, arc, gsm8k]
  #   limit:     150
  #   reps:      1

# ── Execution ─────────────────────────────────────────────────────────────────
concurrency: 64              # subprocesses; harness runs are I/O bound on vLLM
# Cores each task may use. Libraries in the harness stacks size thread pools
# from the visible CPU count (chromadb's tokio runtime opened one worker per
# core: ~682 threads per Captain process on this 240-core box, which hit the
# cgroup pid limit and made chromadb fail with EAGAIN). Pinning affinity caps
# every such pool at once: ~13 threads per task at 4 cores. Harness runs are
# I/O bound on the vLLM endpoint, so oversubscription here is harmless.
cpus_per_task: 4
max_round:   20
retries:     1               # re-attempts for a timed-out or crashed run
timeout_s:
  default:        900
  gaia:           2400       # captain averaged ~19 min on a gaia task
  assistantbench: 2400
out_root: datagen/runs

# Success/failure re-judging (judge/rejudge.py). The harnesses' own in-run
# judges are permissive substring matches and are never trusted.
judge:
  endpoint: qwen3.5-9b       # a serve.yaml key, or an inline {base_url, model}
  f1_threshold: 0.6          # exact/open QA: below this, escalate to the LLM judge
