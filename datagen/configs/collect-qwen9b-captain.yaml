# Phase-1 collection: qwen3.5-9b x Captain-Agent.
#
#   python datagen/collect/run_batch.py --config collect-qwen9b-captain --dry-run
#   python datagen/collect/run_batch.py --config collect-qwen9b-captain
#
# One config = one (backbone, agent system). Self-contained: tune it without
# touching any other run. Endpoints are the one thing NOT set here — they come
# from serve.yaml. All configs share `out_root`, so every combination lands in
# one run tree keyed by harness/backbone and is judged and converted together.
#
# Captain-Agent only. The Captain autobuilds an expert team via the
# `seek_experts_help` tool call; experts get web/wikipedia/arxiv tools bound
# into their system prompts and run them through Computer_terminal.
# Needs SERPER_API_KEY in the environment (or the harness .env) for
# perform_web_search; budget roughly 3 searches per run.

backbone: qwen3.5-9b

# ── Harness ───────────────────────────────────────────────────────────────────
# Only this harness is defined, so naming any other in `matrix` is a hard error
# — a config cannot silently run the system it was not meant to.
harnesses:
  captain:
    root:   datagen/TraceElephant/code/agent_system/Captain-Agent
    python: .venv/bin/python
    driver: scripts/run_pool.py
    # The vendored autogen 0.2 fork is imported from the harness repo root.
    pythonpath: "."

# ── What to run ───────────────────────────────────────────────────────────────
# Identical pools/limits/reps across all four configs so backbones and agent
# systems stay directly comparable.
matrix:
  # NOTE: only the web-native pools are active. The others are commented out
  # rather than deleted so the full matrix can be restored in one edit.
  #   - gsm8k / math500 / arc / mmlu-pro are self-contained (76-84% solved with
  #     NO web access) and need no Serper budget, but yield shallow trajectories
  #     (arc max 6 steps, median 4-5) with little attribution signal.
  #   - hotpotqa / 2wikimqa / musique score 9-31% only because pools/prepare.py
  #     drops their supporting-context paragraphs, turning reading comprehension
  #     into closed-book trivia. Re-enable them once context is added, not before.
  - harnesses: [captain]
    pools:     [gaia, assistantbench]
    limit:     null
    reps:      1
  # - harnesses: [captain]
  #   pools:     [math500, mmlu-pro]
  #   limit:     300
  #   reps:      1
  # - harnesses: [captain]
  #   pools:     [hotpotqa, 2wikimqa, musique, arc, gsm8k]
  #   limit:     150
  #   reps:      1

# ── Execution ─────────────────────────────────────────────────────────────────
# Concurrency is high: a 9B replica absorbs many concurrent requests
# before queueing, and harness runs are I/O bound on the endpoint.
concurrency: 64
# Cores each task may use. Libraries in the harness stacks size thread pools
# from the visible CPU count (chromadb's tokio runtime opened one worker per
# core: ~682 threads per Captain process on this 240-core box, which hit the
# cgroup pid limit and made chromadb fail with EAGAIN). Pinning affinity caps
# every such pool at once: ~13 threads per task at 4 cores. Harness runs are
# I/O bound on the vLLM endpoint, so oversubscription here is harmless.
cpus_per_task: 4
max_round:   20
retries:     1               # re-attempts for a timed-out or crashed run
timeout_s:
  default:        900
  gaia:           2400       # captain averaged ~19 min on a gaia task
  assistantbench: 2400
out_root: datagen/runs

# Read by judge/rejudge.py. Keep `out_root` and `judge` identical across every
# collect config — all runs share one tree and are judged in a single pass.
judge:
  endpoint: qwen3.5-9b
  f1_threshold: 0.6
