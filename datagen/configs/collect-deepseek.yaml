# Phase-1 collection with DeepSeek-R1-Distill-Llama-8B as the agent backbone.
#
#   python datagen/collect/run_batch.py --config collect-deepseek --dry-run
#   python datagen/collect/run_batch.py --config collect-deepseek
#
# Self-contained: tune this file without affecting the qwen run. Endpoints are
# the one thing NOT set here — they come from serve.yaml.
#
# MAGENTIC-ONE ONLY, and this is a hard constraint rather than a choice:
# Captain-Agent delegates solely through the `seek_experts_help` native tool
# call (meta_agent.py:187, no code-block fallback). R1-Distill is not tool-call
# trained, so its endpoint runs without a tool parser and the delegation can
# never fire — runs degenerate to ~2 steps with no expert team. Both
# `deepseek_v3` (HTTP 500, expected tokens never emitted) and `llama3_json`
# (model never calls the tool) were tried and rejected. Hence no `captain`
# entry below.

backbone: deepseek-8b

# ── Harness ───────────────────────────────────────────────────────────────────
harnesses:
  magentic:
    root:   datagen/TraceElephant/code/agent_system/Magentic-One
    python: .venv/bin/python
    driver: run_pool.py
    # No FileSurfer: it needs function calling, which this endpoint lacks.
    agents: coder,executor
    # autogen must not send `tools` at all, or the server rejects the request.
    no_function_calling: true

# ── What to run ───────────────────────────────────────────────────────────────
# Mirrors the qwen tiers so the two backbones stay comparable. See
# collect-qwen.yaml for the difficulty-weighting rationale.
matrix:
  # NOTE: only the web-native pools are active. The others are commented out
  # rather than deleted so the full matrix can be restored in one edit.
  #   - gsm8k / math500 / arc / mmlu-pro are self-contained (76-84% solved with
  #     NO web access) and need no Serper budget, but yield shallow trajectories
  #     (arc max 6 steps, median 4-5) with little attribution signal.
  #   - hotpotqa / 2wikimqa / musique score 9-31% only because pools/prepare.py
  #     drops their supporting-context paragraphs, turning reading comprehension
  #     into closed-book trivia. Re-enable them once context is added, not before.
  - harnesses: [magentic]
    pools:     [gaia, assistantbench]
    limit:     null
    reps:      1
  # - harnesses: [magentic]
  #   pools:     [math500, mmlu-pro]
  #   limit:     300
  #   reps:      1
  # - harnesses: [magentic]
  #   pools:     [hotpotqa, 2wikimqa, musique, arc, gsm8k]
  #   limit:     150
  #   reps:      1

# ── Execution ─────────────────────────────────────────────────────────────────
concurrency: 64
# Cores each task may use. Libraries in the harness stacks size thread pools
# from the visible CPU count (chromadb's tokio runtime opened one worker per
# core: ~682 threads per Captain process on this 240-core box, which hit the
# cgroup pid limit and made chromadb fail with EAGAIN). Pinning affinity caps
# every such pool at once: ~13 threads per task at 4 cores. Harness runs are
# I/O bound on the vLLM endpoint, so oversubscription here is harmless.
cpus_per_task: 4
max_round:   20
retries:     1
timeout_s:
  default:        900
  gaia:           2400
  assistantbench: 2400
out_root: datagen/runs

# Judge settings are read by judge/rejudge.py. Keep `out_root` and `judge` in
# step with collect-qwen.yaml — both backbones write into the same run tree and
# are judged in one pass.
judge:
  endpoint: qwen3.5-9b       # judged by the stronger model regardless of backbone
  f1_threshold: 0.6
