# experiments/reports/configs/discounted_v2.yaml
# Config for build_discounted_tables_v2.py
#
# All keys are optional — the script uses built-in defaults for anything omitted.
# Override on the CLI with repeatable --set, e.g.
#   python -m experiments.reports.build_discounted_tables_v2 \
#       --config experiments/reports/configs/discounted_v2.yaml \
#       --set sweep_root=outputs-1006/discounted-sweep/226 \
#       --set out_root=outputs-1006/discounted-splits/226

# Input: rescore.sweep output, read as {sweep_root}/{model}/{subset}/svd.tsv
sweep_root: outputs-1006/discounted-splits/sweep/112

# Output: reduced tables written to {out_root}/{model}/{subset}/svd.tsv
out_root:   outputs-1006/discounted-splits/reduced/112

models:
  - deepseek-8b
  - llama-3.1-8b
  - qwen3-8b
  - qwen3-14b

subsets:
  - algorithm-generated
  - hand-crafted