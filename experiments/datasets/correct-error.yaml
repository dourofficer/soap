# Dataset manifest — single source of truth for the CORRECT-Error dataset.
# Shared by every stage (activations, attention, svd, rescore, reports, reproduce);
# stage configs declare `dataset: correct-error` and add only their sweep axes.
#
# Output roots are DERIVED from this file by experiments/_common/paths.py:
#   outputs-correct-error/{activations,attention,weighted-projections/325,...}
# (base = outputs-<name>; split-tag 325 derived from splits 0.3/0.2/0.5).

name:      correct-error
data_root: data/correct-error

models: [qwen3.5-9b, deepseek-8b, llama-3.1-8b, qwen3-8b]

# model_paths:
#   qwen3.5-9b:   /home/thanhdo/hub/Qwen/Qwen3.5-9B
#   qwen3-8b:     /home/thanhdo/hub/Qwen/Qwen3-8B
#   llama-3.1-8b: /home/thanhdo/hub/meta-llama/Llama-3.1-8B-Instruct
#   deepseek-8b:  /home/thanhdo/hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

model_paths:
  qwen3.5-9b:   /data/hoang/resources/models/Qwen/Qwen3.5-9B
  qwen3-8b:     /data/hoang/resources/models/Qwen/Qwen3-8B
  llama-3.1-8b: /data/hoang/resources/models/meta-llama/Llama-3.1-8B-Instruct
  deepseek-8b:  /data/hoang/resources/models/deepseek-ai/DeepSeek-R1-Distill-Llama-8B
subsets: [arc, hotpot, musique, wikimqa, math500, mmlu_pro, gaia]

# Per-step context window — MUST be shared by activations + attention so w_{i,t}
# and S(s_i) use the same predecessor window.
max_tokens: 8192

# train/val/test split ratios (must sum to 1). Tag "325" is derived from these
# and baked into every split-tagged output root.
splits:
  train: 0.3
  val:   0.2
  test:  0.5

seeds: [1, 2, 3]
