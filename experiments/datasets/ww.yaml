# Dataset manifest — Who&When (ww). This is the original dataset; its old
# outputs/ layout was inconsistent (untagged outputs/projections, later
# outputs-1906 for the seeding run) and is now stale. Going forward ww uses the
# same derived, split-tagged scheme as every other dataset:
#   outputs-ww/{activations,attention,weighted-projections/325,...}
# The legacy split-ratio variant configs (112/226/316/424/seeding) are kept under
# experiments/legacy/configs/ for reference.

name:      ww
data_root: data/ww

models: [qwen3.5-9b, deepseek-8b, llama-3.1-8b, qwen3-8b]

# model_paths:
#   qwen3.5-9b:   /home/thanhdo/hub/Qwen/Qwen3.5-9B
#   qwen3-8b:     /home/thanhdo/hub/Qwen/Qwen3-8B
#   llama-3.1-8b: /home/thanhdo/hub/meta-llama/Llama-3.1-8B-Instruct
#   deepseek-8b:  /home/thanhdo/hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

# model_paths:
#   qwen3.5-9b:   /data/hoang/resources/models/Qwen/Qwen3.5-9B
#   qwen3-8b:     /data/hoang/resources/models/Qwen/Qwen3-8B
#   llama-3.1-8b: /data/hoang/resources/models/meta-llama/Llama-3.1-8B-Instruct
#   deepseek-8b:  /data/hoang/resources/models/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

model_paths:
  qwen3.5-9b:   ../hub/Qwen/Qwen3.5-9B
  qwen3-8b:     ../hub/Qwen/Qwen3-8B
  llama-3.1-8b: ../hub/meta-llama/Llama-3.1-8B-Instruct
  deepseek-8b:  ../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

subsets: [algorithm-generated, hand-crafted]

max_tokens: 8192

splits:
  train: 0.3
  val:   0.2
  test:  0.5

seeds: [1, 2, 3]
