# Reproduce/apply stage — CORRECT-Error. Shared knobs from
# experiments/datasets/correct-error.yaml; roots derived by _common/paths.py.
dataset: correct-error

device:   cuda
n_ranges: 4        # must match the rescore sweep that produced the reduced table

select: best       # best | explicit
split:  test       # test | val | all
top_k:  null       # null = every seed; else keep top-K seeds by disc_step_acc_test

# Constant SVD columns dropped by the reduced table (must match the undiscounted
# source the rescore sweep consumed — weighted_false.tsv → proj / False).
method:   proj
weighted: false
