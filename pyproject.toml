[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "attribscope-v2"
version = "0.2.0"
requires-python = ">=3.10"
# v2 reuses the parent repo's environment (uv.lock). No install needed: every
# runner is invoked as `python -m src.<stage>...` FROM the v2/ directory,
# which puts v2/ on sys.path so `src` imports directly.
dependencies = [
    "matplotlib>=3.8",
    "numpy",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "rich",
    "safetensors",
    "torch>=2.10.0",
    "transformers>=5.3.0",
    "tqdm",
]

[tool.hatch.build.targets.wheel]
packages = ["src"]
