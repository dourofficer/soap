models:  [qwen3.5-9b, deepseek-8b, llama-3.1-8b, qwen3-8b]
subsets: [magentic, captain]

data_dir:     data/traceelephant
outputs_root: outputs-traceelephant/chief

mode: batched

dtype:          bfloat16
seed:           0
temperature:    0.0
top_p:          1.0
gen_max_tokens: 2048
enable_thinking: false

max_model_len:          131072
truncate_prompt_tokens: null
gpu_memory_utilization: 0.90
tensor_parallel_size:   1

start_idx: 0
end_idx:   null

# TraceElephant is off-domain for CHIEF's GAIA/AssistantBench KBs → RAG disabled.
# Flip enabled:true, kb:[gaia] to reuse Who&When's KB off-domain if desired.
rag:
  enabled: false
  kb: [gaia, assistantbench]
  root: baselines/CHIEF/rag
  top_k: 2

model_paths:
  qwen3.5-9b:   /data/hoang/resources/models/Qwen/Qwen3.5-9B
  qwen3-8b:     /data/hoang/resources/models/Qwen/Qwen3-8B
  llama-3.1-8b: /data/hoang/resources/models/meta-llama/Llama-3.1-8B-Instruct
  deepseek-8b:  /data/hoang/resources/models/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

tokenizer_paths:
  deepseek-8b: baselines/prompting/tokenizers/deepseek-8b
