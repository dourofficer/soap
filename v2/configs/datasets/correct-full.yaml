# Dataset manifest — CORRECT-Full (all CORRECT-Error distribution subsets merged into
# one `magentic` subset; every trajectory comes from the Magentic-One system).
# Corpus in data/correct-full/<subset>/; output roots derived by src/common/paths.py
# under outputs/correct-full/ (split tag "325" from splits 0.3/0.2/0.5).
name: correct-full

models: [qwen3.5-9b, deepseek-8b]
# model_paths point at an external HF weights tree (weights are not vendored);
# adjust these if the repo moves. Only the extract stage reads them.
model_paths:
  qwen3.5-9b:  ../../hub/Qwen/Qwen3.5-9B
  deepseek-8b: ../../hub/deepseek-ai/DeepSeek-R1-Distill-Llama-8B

subsets:   [magentic]
max_tokens: 8192

splits: {train: 0.3, val: 0.2, test: 0.5}     # -> tag "325"
seeds:  [1, 2, 3]
ks:     [1, 3]                                  # metric ks, shared by score + rescore
