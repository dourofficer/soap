# Activations stage — CORRECT-Full. Shared knobs come from
# experiments/datasets/correct-full.yaml; this file holds only the stage axes.
# NOTE: merged activations already exist (migrated from correct-error by
# ./merge_correct_full.py); this config is only for future re-extraction.
dataset: correct-full

device: auto
dtype:  bfloat16
context: all   # "dependency" | "all"

layers: all    # "embed" | "act/<N>" | "act/<N>_normed" | "all"
pool:   all    # "last" | "mean" | "all"

# Trajectory slice — both optional (null = no limit).
start_idx: 0
end_idx:   null
