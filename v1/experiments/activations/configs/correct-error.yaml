# Activations stage — CORRECT-Error. Shared knobs come from
# experiments/datasets/correct-error.yaml; this file holds only the stage axes.
dataset: correct-error

device: auto
dtype:  bfloat16
context: all   # "dependency" | "all"

layers: all    # "embed" | "act/<N>" | "act/<N>_normed" | "all"
pool:   all    # "last" | "mean" | "all"

# Trajectory slice — both optional (null = no limit).
start_idx: 0
end_idx:   null
