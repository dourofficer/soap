# Config for the OPTIONAL migration check (tests/test_parity.py): proj + norm
# baselines only, weighted swept both ways, ensemble off, ks=[1]. Writes to the
# `parity` split-tag so it never collides with a real run.
dataset: correct-full

device:   cuda
poolings: [mean, last]
positions: all
methods:  [proj, norm_l1, norm_l2]
weighted: [false, true]
n_components: 20
ks: [1]

