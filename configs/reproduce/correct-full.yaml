# Reproduce stage — correct-full. Re-runs the triples selection's frozen winners and writes
# PER-STEP scores (base / oriented / normalized / final + rank) for inspection and
# plotting; verifies the reproduced window-mean accuracy equals the recorded one.
dataset: correct-full

device:   cuda
poolings: [mean, last]
n_ranges: 4

rows: ["SVD (proj)", backprop, succ-strong, succ-near]  # selection row labels
windows: all              # all | list of window FIRST seeds, e.g. [1, 9]
split:  test              # val | test | all ('all' = apply mode)
verify: true              # assert reproduced window mean == recorded step_acc_test
