# Score stage — CORRECT-Full. Full scorer set; pooling is a column (both loaded per
# run). weighted stays [false] (unweighted wins; weighted kept for reference only).
dataset: ww

device:    cuda
poolings:  [mean, last]
positions: all
methods:   [proj, resid, angres, norm_l2, norm_l1]
weighted:  [false]
n_components: 20

ensemble:
  enabled: true
  kind: ens-mid3            # z-averaged mid-depth layer band (added in refinements)
