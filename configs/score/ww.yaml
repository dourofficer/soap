# Score stage — ww.
#
# Every axis below is a CONFIG value, not a code constant: the scorers, poolings,
# centered and weighted arms all remain implemented and sweepable. The production
# grid PINS them to the protocol's fixed choices (mean pooling, uncentered SVD,
# projection scorer, unweighted) — restore the fuller lists to sweep them again:
#   poolings: [mean, last]
#   methods:  [proj, resid, angres, norm_l2, norm_l1]
#   centered: [true, false]
#   weighted: [false, true]        # only proj honours weighted
dataset: ww

device:    cuda
poolings:  [mean]
positions: all
methods:   [proj]
centered:  [false]
weighted:  [false]
n_components: 20

ensemble:
  enabled: true
  kind: ens-mid3            # z-averaged mid-depth layer band
